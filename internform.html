<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Internship Application Form</h1>
    <form action="/register" method="post">
        <label for="fullname">Full name:</label> 
        <br>
        <input type="text" id="fullname",name="fullname" placeholder="enter name"> 
        <br>
        <label for="email">University email</label><br>
        <input type="email" id="email" name="email" placeholder="enter email"> 
        <br>
        <label for="phone">Phone number:</label> <br>
        <input type="tel" id="phone" name="phone" placeholder="enter phone number">
        <br>
        <label for="dateOfBirth">Date Of Birth:</label> <br>
        <input type="date" name="dateOfBirth" id="dateOfBirth">
        <br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password">
        <br>
        <label for="gender" >Gender:</label><br>
        <input type="radio" value="male" name="gender" id="male">
        <label for="male">Male</label>
        <input type="radio" value="female" name="gender" id="female">
        <label for="female">Female</label>
        <input type="radio" value="other" name="gender" id="other">
        <label for="other">Other</label>
        <br>
        <label> Select Branch:</label>
        <br>
        <select name="branch" id="branch">
            <option value="cse">CSE</option>
            <option value="ece">ECE</option>
            <option value="mech">MECH</option>
            <option value="civil">CIVIL</option>
        </select>
        <br>
        <label> skills:</label><br>
        <input type="checkbox" name="skills" value="JavaScript" id="JavaScript">
        <label for="JavaScript">JavaScript</label>
        <input type="checkbox" name="skills" value="Java" id="Java">
        <label for="Java">Java</label> 
        <input type="checkbox" name="skills" value="HTML" id="HTML">
        <label for="HTML">HTML</label> 
        <input type="checkbox" name="skills" value="CSS" id="CSS">
        <label for="CSS">CSS</label> 
        <input type="checkbox" name="skills" value="React" id="React">
        <label for="React">React</label> 
        <br>

        <label for="Internship Preference" >Internship Preference:</label><br>
        <input type="radio" value="remote" name="remote" id="remote">
        <label for="remote">remote</label>
        <input type="radio" value="on-site" name="remote" id="on-site">
        <label for="on-site">on-site</label>
        <br>
        <label for="resume">Upload Resume:</label><br>
        <input type="file" id="resume" name="resume">
        <br>
        <label for="feedback">Your Feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="4" cols="50">
        </textarea>
        <br>
        <input type="submit" value="Submit">

        <input type="Reset" value="Reset">
        <br>

    </form>
</body>
</html>
